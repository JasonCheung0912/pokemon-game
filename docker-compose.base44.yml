services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    environment:
      - MODAL_SANDBOX_ID=e2b
      - VITE_BASE44_APP_ID=6a7431d0e384662733bae098
      - VITE_BASE44_APP_BASE_URL=${VITE_BASE44_APP_BASE_URL:-}
      - VITE_BASE44_FUNCTIONS_VERSION=${VITE_BASE44_FUNCTIONS_VERSION:-}
    env_file:
      - /run/base44/app.env
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  node_modules:
