services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    environment:
      - MODAL_SANDBOX_ID=base44
      - VITE_BASE44_APP_ID=6a7431d0e384662733bae098
      - VITE_BASE44_APP_BASE_URL=${VITE_BASE44_APP_BASE_URL:-https://api.base44.com}
      - VITE_BASE44_FUNCTIONS_VERSION=${VITE_BASE44_FUNCTIONS_VERSION:-}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)throw new Error('bad')}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  node_modules:
